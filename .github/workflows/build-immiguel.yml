name: Build Immiguel (Docker & Android APK)

on:
  workflow_dispatch:
    inputs:
      build_docker:
        description: 'Build Immiguel Server Docker image'
        type: boolean
        default: true
      build_apk:
        description: 'Build Immiguel Android APK'
        type: boolean
        default: true
      push_docker:
        description: 'Push Docker image to GitHub Container Registry'
        type: boolean
        default: true
  push:
    branches:
      - main
      - feat/immiguel
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/sync-upstream.yml'
      - '.github/workflows/org-zizmor.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check path filters
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'server/**'
              - 'web/**'
              - 'packages/**'
              - 'i18n/**'
              - 'Dockerfile'
              - 'server/Dockerfile'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/build-immiguel.yml'
            mobile:
              - 'mobile/**'
              - 'packages/sdk/**'
              - '.github/workflows/build-immiguel.yml'

  build-immiguel-docker:
    name: Build Immiguel Server Docker Image
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_docker || startsWith(github.ref, 'refs/tags/v') || needs.detect-changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_docker }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/immiguel-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/immiguel' }}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: ${{ (github.event_name != 'workflow_dispatch' || inputs.push_docker) && !github.event.pull_request.head.repo.fork }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-immiguel-apk:
    name: Build Immiguel Android APK
    needs: detect-changes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk || startsWith(github.ref, 'refs/tags/v') || needs.detect-changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m"
      _JAVA_OPTIONS: "-Xmx5120m"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile

      - name: Setup Mise
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: true
          monorepo: false

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Perform codegen
        run: mise //mobile:codegen

      - name: Build Android Release APK
        working-directory: ./mobile
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/immiguel.apk

      - name: Upload Immiguel APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: immiguel-android-apk
          path: mobile/build/app/outputs/flutter-apk/immiguel.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(date +'%Y%m%d%H%M%S')
          TAG="v${VERSION}"
          gh release create "$TAG" mobile/build/app/outputs/flutter-apk/immiguel.apk \
            --title "Immiguel v${VERSION}" \
            --notes "### Immiguel Release v${VERSION}

          - **Android APK**: \`immiguel.apk\` (with native 50 MB chunked uploads)
          - **Docker Image**: \`ghcr.io/${{ github.repository_owner }}/immiguel-server:latest\`
          - **Commit**: \`${{ github.sha }}\`"
