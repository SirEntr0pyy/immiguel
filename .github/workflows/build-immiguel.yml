name: Build Immiguel Server (Docker)

on:
  workflow_dispatch:
    inputs:
      push_docker:
        description: 'Push Docker image to GitHub Container Registry'
        type: boolean
        default: true
  push:
    branches:
      - main
      - feat/immiguel
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - 'mobile/**'
      - '.github/workflows/sync-upstream.yml'
      - '.github/workflows/org-zizmor.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-immiguel-docker:
    name: Build Immiguel Server Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Immiguel Version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(date +'%Y.%m.%d')
          fi
          echo "IMMIGUEL_VERSION=${VERSION}" >> "$GITHUB_ENV"
          sed -i 's/"version": "[^"]*"/"version": "'"${VERSION}"'"/' package.json server/package.json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_docker }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/immiguel-server
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/immiguel' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ env.IMMIGUEL_VERSION }},enable=true
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: ${{ (github.event_name != 'workflow_dispatch' || inputs.push_docker) && !github.event.pull_request.head.repo.fork }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
