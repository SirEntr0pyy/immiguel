name: Sync with Upstream

on:
  schedule:
    - cron: '0 4 * * *' # Runs daily at 04:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-upstream:
    name: Sync with Upstream Immich
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream changes
        run: |
          git remote add upstream https://github.com/immich-app/immich.git || git remote set-url upstream https://github.com/immich-app/immich.git
          git fetch upstream main --tags

      - name: Check for upstream commits
        id: check
        run: |
          BEHIND_COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "behind_count=${BEHIND_COUNT}" >> "$GITHUB_OUTPUT"
          echo "Commits behind upstream: ${BEHIND_COUNT}"

      - name: Merge upstream and preserve Immiguel principles
        if: ${{ steps.check.outputs.behind_count > 0 }}
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting merge of upstream/main into main..."
          git merge upstream/main -m "chore(sync): sync with upstream immich-app/immich" || true

          # Auto-resolve known customized files by preserving Immiguel versions
          if git status --porcelain | grep -q 'README.md'; then
            echo "Preserving Immiguel README.md..."
            git checkout --ours README.md
            git add README.md
          fi

          # Auto-resolve files deleted in Immiguel that upstream modified (DU)
          git status --porcelain | grep '^DU ' | awk '{print $2}' | while read -r file; do
            echo "Removing deleted file modified by upstream: $file"
            git rm -f "$file" || rm -f "$file"
          done

          # Ensure iOS stays completely removed
          if [ -d "mobile/ios" ]; then
            echo "Removing mobile/ios..."
            rm -rf mobile/ios
            git rm -rf mobile/ios 2>/dev/null || true
          fi

          # Auto-resolve server migration ORDER file from actual migration files on disk
          if git status --porcelain | grep -q 'server/src/schema/migrations/ORDER'; then
            echo "Regenerating server/src/schema/migrations/ORDER from migration files on disk..."
            python3 -c "
import os
migrations = sorted([f[:-3] for f in os.listdir('server/src/schema/migrations') if f.endswith('.ts')])
with open('server/src/schema/migrations/ORDER', 'w') as f:
    f.write('\n'.join(migrations) + '\n')
"
            git add server/src/schema/migrations/ORDER
          fi

          # If any unmerged files remain
          UNMERGED=$(git status --porcelain | grep -E '^(DD|AU|UD|UA|DU|AA|UU) ' || true)
          if [ -n "$UNMERGED" ]; then
            echo "Unresolvable merge conflicts detected in:"
            echo "$UNMERGED"
            git merge --abort

            DATE_TAG=$(date +'%Y%m%d%H%M%S')
            BRANCH_NAME="sync-upstream-${DATE_TAG}"

            git checkout -b "$BRANCH_NAME"
            git merge upstream/main || true
            git push origin "$BRANCH_NAME"

            echo "### ⚠️ Upstream Sync Conflicts Detected" >> "$GITHUB_STEP_SUMMARY"
            echo "Automatic sync with \`immich-app/immich:main\` encountered conflicts on branch \`${BRANCH_NAME}\`." >> "$GITHUB_STEP_SUMMARY"
            echo "Conflicting files:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            echo "$UNMERGED" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Conclude merge if in progress
          if [ -f .git/MERGE_HEAD ]; then
            git commit -m "chore(sync): sync with upstream immich-app/immich"
          fi

          echo "Merge clean! Preserving Immiguel principles..."

          # 1. Ensure iOS stays removed
          if [ -d "mobile/ios" ]; then
            rm -rf mobile/ios
            git rm -rf mobile/ios 2>/dev/null || true
          fi

          # 2. Preserve custom Android package ID
          sed -i 's/applicationId "app.alextran.immich"/applicationId "com.sirentr0pyy.immiguel"/' mobile/android/app/build.gradle

          # 3. Preserve custom version checker URL
          sed -i "s|url:.*version.*immich\.cloud.*|url: process.env.IMMICH_VERSION_CHECK_URL ?? 'https://api.github.com/repos/SirEntr0pyy/immiguel/releases/latest',|" server/src/repositories/config.repository.ts

          # Commit any adjustments if modified
          if ! git diff --quiet; then
            git commit -am "chore(immiguel): preserve Immiguel principles (no iOS, isolated package ID, custom update check)"
          fi

          echo "Pushing synced branch to origin main..."
          git push origin main
          echo "Triggering Immiguel build pipeline..."
          gh workflow run build-immiguel.yml --ref main || true
          echo "Synced successfully with upstream and triggered build!"
