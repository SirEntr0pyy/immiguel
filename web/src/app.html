<!doctype html>
<html class="dark">
  <head>
    <!-- (used for SSR) -->
    <!-- metadata:tags -->

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" type="image/x-icon" sizes="32x32" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon-180.png" />
    <link rel="preload" as="font" type="font/ttf" href="%app.font%" crossorigin="anonymous" />
    <link rel="preload" as="font" type="font/ttf" href="%app.monofont%" crossorigin="anonymous" />

    <script>
      try {
        const preference = JSON.parse(localStorage.getItem('immich-ui-theme'));
        const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
        if (preference === 'light' || (preference !== 'dark' && !prefersDark)) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch {
        // noop
      }
    </script>

    %sveltekit.head%

    <style>
      /* prevent FOUC */
      html {
        height: 100%;
        width: 100%;
      }

      html.dark {
        background-color: black;
      }

      html.light {
        background-color: white;
      }

      body,
      html {
        margin: 0;
        padding: 0;
      }

      @keyframes delayedVisibility {
        to {
          visibility: visible;
        }
      }

      @keyframes loadspin {
        100% {
          transform: rotate(360deg);
        }
      }

      #stencil {
        --stencil-width: 150px;
        display: flex;
        width: var(--stencil-width);
        margin-left: auto;
        margin-right: auto;
        margin-top: calc(50vh - var(--stencil-width) / 2);
        margin-bottom: 100vh;
        place-items: center;
        justify-content: center;
        overflow: hidden;
        visibility: hidden;
        animation:
          0s linear 0.3s forwards delayedVisibility,
          loadspin 8s linear infinite;
      }
    </style>
    <link rel="stylesheet" href="/custom.css" />
  </head>

  <noscript style="position: absolute; top: 0px; z-index: 1000; color: black; background-color: white">
    To use Immiguel, you must enable JavaScript or use a JavaScript compatible browser.
  </noscript>

  <body class="bg-light text-dark">
    <div id="stencil">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 792">
        <style type="text/css">
          .st0 {
            fill: #fa2921;
          }
          .st1 {
            fill: #ed79b5;
          }
          .st2 {
            fill: #ffb400;
          }
          .st3 {
            fill: #1e83f7;
          }
          .st4 {
            fill: #18c249;
          }
        </style>
        <g>
          <path class="st0" d="M396,230 C370,290 338,368 316,420 C354,402 396,442 396,480 C396,442 438,402 476,420 C454,368 422,290 396,230 Z" />
          <path class="st1" d="M260,162 C178,162 132,232 132,328 C132,395 170,454 238,454 C278,454 322,406 342,348 C360,292 334,200 260,162 Z" />
          <path class="st2" d="M532,162 C458,200 432,292 450,348 C470,406 514,454 554,454 C622,454 660,395 660,328 C660,232 614,162 532,162 Z" />
          <path class="st3" d="M142,360 C136,426 138,534 162,588 C188,642 254,636 270,580 C284,522 282,440 256,382 C232,368 175,360 142,360 Z" />
          <path class="st4" d="M650,360 C617,360 560,368 536,382 C510,440 508,522 522,580 C538,636 604,642 630,588 C654,534 656,426 650,360 Z" />
        </g>
      </svg>
    </div>
    <div>%sveltekit.body%</div>
  </body>
</html>
